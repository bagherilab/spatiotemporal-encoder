[project]
name = "simulation-encoder"
version = "0.1.0"
description = "Autoencoder system for sequential image data"
authors = [{ name = "Jacob Evarts", email = "jevarts@uw.edu" }]
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "torch>=2.3.0,<3",
    "pandas>=2.2.2,<3",
    "pillow>=10.3.0,<11",
    "scipy==1.12.0",
    "matplotlib>=3.9.0,<4",
    "pyyaml>=6.0.1,<7",
    "scikit-learn>=1.5.0,<2",
    "torchvision>=0.18.1,<0.19",
    "pydantic>=2.8.2,<3",
    "seaborn>=0.13.2,<0.14",
    "ipykernel>=6.29.5,<7",
    "llvmlite>=0.43.0,<0.44",
    "umap-learn>=0.5.6,<0.6",
    "neuraloperator>=0.3.0",
    "wandb>=0.19.7",
]

[project.optional-dependencies]
test = [
    "ruff>=0.9.8",
]

[dependency-groups]
test = [
    "pytest>=8.2.2,<9",
    "black>=24.4.2,<25",
    "mypy>=1.10.1,<2",
    "pylint>=3.2.4,<4",
    "pytest-cov>=5.0.0,<6",
    "tox>=4.15.1,<5",
    "snakeviz>=2.2.0,<3",
    "ruff>=0.9.8",
]
dev = [
    "ipykernel>=6.29.4,<7",
]
ruff = [
    "ruff>=0.9.8",
]

[tool.uv]
default-groups = [
    "test",
    "dev",
]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 88
indent-width = 4

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
ignore = ["B007", "E501"]

[tool.hatch.build.targets.sdist]
include = ["src/simulation_encoder"]

[tool.hatch.build.targets.wheel]
include = ["src/simulation_encoder"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

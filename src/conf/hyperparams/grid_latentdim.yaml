num_epochs: 50
continuous:
  image_loss_weight:
    range: 0.9
    search: linear
    num_samples: 1
discrete:
  latent_dim:
    # values: [2, 4, 8, 16, 32]
    values: [16]
  optimizer:
    values:
      - type: "Adam"
        lr: [0.001, 0.0001, 0.00001]
        betas: [[0.8, 0.99], [0.9, 0.99], [0.95, 0.99]]
type: AE
architecture:
  encoder:
    - type: FNO
      n_modes: [16, 16]
      hidden_channels: 64
      in_channels: num_channels
      out_channels: 64
    - type: BatchNorm2d
      num_features: 64
    - type: GELU
    - type: MaxPool2d
      kernel_size: 2
      stride: 2

    - type: AdaptiveAvgPool2d
      output_size: 1
    - type: Flatten
    - type: Linear
      in_features: 64
      out_features: 512
    - type: BatchNorm1d
      num_features: 512
    - type: ReLU

    - type: Linear
      in_features: 512
      out_features: latent_dim

  decoder_image:
    - type: Linear
      in_features: latent_dim
      out_features: 512
    - type: BatchNorm1d
      num_features: 512
    - type: ReLU

    - type: Linear
      in_features: 512
      out_features: 64
    - type: Unflatten
      shape: [64, 1, 1]

    - type: Upsample
      scale_factor: 64
      mode: nearest
    - type: Upsample
      scale_factor: 2
      mode: nearest

    - type: BatchNorm2d
      num_features: 64
    - type: GELU

    - type: FNO
      n_modes: [16, 16]
      hidden_channels: 64
      in_channels: 64
      out_channels: num_channels
    - type: Sigmoid

  decoder_timepoint:
    - type: Linear
      in_features: latent_dim
      out_features: 64
    - type: BatchNorm1d
      num_features: 64
    - type: ReLU

    - type: Linear
      in_features: 64
      out_features: 32
    - type: BatchNorm1d
      num_features: 32
    - type: ReLU

    - type: Linear
      in_features: 32
      out_features: num_timepoints

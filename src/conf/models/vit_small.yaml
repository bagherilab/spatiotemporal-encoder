type: AE
architecture:
  encoder:
    - type: VisionTransformer
      patch_size: 16
      embed_dim: 192
      depth: 6
      num_heads: 3
      mlp_ratio: 4.0
      dropout: 0.0
      pool: mean
      in_channels: num_channels
      image_size: image_size
      latent_dim: latent_dim

  decoder_image:
    - type: Linear
      in_features: latent_dim
      out_features: 128
    - type: BatchNorm1d
      num_features: 128
    - type: ReLU
    
    - type: Linear
      in_features: 128
      out_features: 256
    - type: BatchNorm1d
      num_features: 256
    - type: ReLU
    
    - type: Linear
      in_features: 256
      out_features: 512
    - type: BatchNorm1d
      num_features: 512
    - type: ReLU
    
    - type: Linear
      in_features: 512
      out_features: 1024
    - type: BatchNorm1d
      num_features: 1024
    - type: ReLU
    
    - type: Linear
      in_features: 1024
      out_features: num_channels      

    - type: Unflatten
    - type: Sigmoid

  decoder_timepoint:
    - type: Linear
      in_features: latent_dim
      out_features: 64
    - type: BatchNorm1d
      num_features: 64
    - type: ReLU
    - type: Linear
      in_features: 64
      out_features: 32
    - type: BatchNorm1d
      num_features: 32
    - type: ReLU
    - type: Linear
      in_features: 32
      out_features: num_timepoints

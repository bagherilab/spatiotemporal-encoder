type: CAE
architecture:
  encoder:
    - type: Conv2d
      in_channels: num_channels
      out_channels: 16
      kernel_size: 3
      padding: 1
      stride: 1 # 128
    - type: BatchNorm2d
      num_features: 16
    - type: ReLU
    - type: Dropout
      p: 0.25
    - type: MaxPool2d
      kernel_size: 2
      stride: 2 # 64
    - type: Conv2d
      in_channels: 16
      out_channels: 32
      kernel_size: 3
      padding: 1
      stride: 1 # 64
    - type: BatchNorm2d
      num_features: 32
    - type: ReLU
    - type: MaxPool2d
      kernel_size: 2
      stride: 2 # 32
    - type: Conv2d
      in_channels: 32
      out_channels: 32
      kernel_size: 3
      padding: 1
      stride: 1 # 32
    - type: BatchNorm2d
      num_features: 32
    - type: ReLU
    - type: MaxPool2d
      kernel_size: 2
      stride: 2 # 16
    - type: Conv2d
      in_channels: 32
      out_channels: 64
      kernel_size: 3
      padding: 1
      stride: 1 # 16
    - type: BatchNorm2d
      num_features: 64
    - type: ReLU
    - type: MaxPool2d
      kernel_size: 2
      stride: 2 # 8
    - type: Conv2d
      in_channels: 64
      out_channels: 64
      kernel_size: 3
      padding: 1
      stride: 1 # 8
    - type: BatchNorm2d
      num_features: 64
    - type: ReLU
    - type: Flatten
    - type: Linear
      in_features: 4096
      out_features: latent_dim
    - type: ReLU
  decoder_image:
    - type: Linear
      in_features: latent_dim
      out_features: 4096
    - type: Unflatten
      shape: [64, 8, 8]
    - type: ConvTranspose2d
      in_channels: 64
      out_channels: 64
      kernel_size: 3
      stride: 2 # 16
      padding: 1
      output_padding: 1
    - type: BatchNorm2d
      num_features: 64
    - type: ReLU
    - type: ConvTranspose2d
      in_channels: 64
      out_channels: 32
      kernel_size: 3
      stride: 2 # 32
      padding: 1
      output_padding: 1
    - type: BatchNorm2d
      num_features: 32
    - type: ConvTranspose2d
      in_channels: 32
      out_channels: 32
      kernel_size: 3
      stride: 2 # 64
      padding: 1
      output_padding: 1
    - type: BatchNorm2d
      num_features: 32
    - type: ReLU
    - type: ConvTranspose2d
      in_channels: 32
      out_channels: 16
      kernel_size: 3
      stride: 2 # 128
      padding: 1
      output_padding: 1
    - type: BatchNorm2d
      num_features: 16
    - type: ReLU
    - type: Dropout
      p: 0.25
    - type: ConvTranspose2d
      in_channels: 16
      out_channels: num_channels
      kernel_size: 3
      stride: 1 # 128
      padding: 1
    - type: Sigmoid
  decoder_timepoint:
    - type: Linear
      in_features: latent_dim
      out_features: 512
    - type: BatchNorm1d
      num_features: 512
    - type: ReLU
    - type: Linear
      in_features: 512
      out_features: 256
    - type: BatchNorm1d
      num_features: 256
    - type: ReLU
    - type: Linear
      in_features: 256
      out_features: 128
    - type: BatchNorm1d
      num_features: 128
    - type: ReLU
    - type: Linear
      in_features: 128
      out_features: 64
    - type: BatchNorm1d
      num_features: 64
    - type: ReLU
    - type: Linear
      in_features: 64
      out_features: 15
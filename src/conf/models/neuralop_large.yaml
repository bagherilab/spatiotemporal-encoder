type: AE
architecture:
  encoder:
    - type: FNO
      n_modes: [16, 16]
      hidden_channels: 16
      in_channels: num_channels
      out_channels: 16
    - type: BatchNorm2d
      num_features: 16
    - type: GELU

    - type: FNO
      n_modes: [16, 16]
      hidden_channels: 16
      in_channels: 16
      out_channels: 8
    - type: BatchNorm2d
      num_features: 8
    - type: GELU

    - type: MaxPool2d
      kernel_size: 2
      stride: 2

    - type: Flatten
    - type: Linear
      in_features: 32768
      out_features: 1024
    - type: BatchNorm1d
      num_features: 1024
    - type: ReLU

    - type: Flatten
    - type: Linear
      in_features: 1024
      out_features: 256
    - type: BatchNorm1d
      num_features: 256
    - type: ReLU
    
    - type: Linear
      in_features: 256
      out_features: latent_dim
  
  decoder_image:
    - type: Linear
      in_features: latent_dim
      out_features: 256
    - type: BatchNorm1d
      num_features: 256
    - type: ReLU

    - type: Linear
      in_features: 256
      out_features: 1024
    - type: BatchNorm1d
      num_features: 1024
    - type: ReLU
    
    - type: Linear
      in_features: 1024
      out_features: 32768

    - type: Unflatten
      shape: [8, 64, 64]

    - type: Upsample
      scale_factor: 2
      mode: nearest

    - type: FNO
      n_modes: [16, 16]
      hidden_channels: 8
      in_channels: 8
      out_channels: 16

    - type: FNO
      n_modes: [16, 16]
      hidden_channels: 16
      in_channels: 16
      out_channels: num_channels
    - type: Sigmoid
  
  decoder_timepoint:
    - type: Linear
      in_features: latent_dim
      out_features: 64
    - type: BatchNorm1d
      num_features: 64
    - type: ReLU
    
    - type: Linear
      in_features: 64
      out_features: 32
    - type: BatchNorm1d
      num_features: 32
    - type: ReLU
    
    - type: Linear
      in_features: 32
      out_features: num_timepoints
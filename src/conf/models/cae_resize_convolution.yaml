type: CAE
architecture:
  encoder:
    - type: Conv2d
      in_channels: num_channels
      out_channels: 32
      kernel_size: 4
      padding: 1
      stride: 1
    - type: BatchNorm2d
      num_features: 32
    - type: ReLU
    - type: MaxPool2d
      kernel_size: 2
      stride: 2
    - type: Conv2d
      in_channels: 32
      out_channels: 64
      kernel_size: 4
      padding: 1
      stride: 1
    - type: BatchNorm2d
      num_features: 64
    - type: ReLU
    - type: MaxPool2d
      kernel_size: 2
      stride: 2
    - type: Conv2d
      in_channels: 64
      out_channels: 32
      kernel_size: 2
      padding: 1
      stride: 1
    - type: BatchNorm2d
      num_features: 32
    - type: ReLU
    - type: MaxPool2d
      kernel_size: 2
      stride: 2
    - type: Conv2d
      in_channels: 32
      out_channels: 32
      kernel_size: 2
      padding: 1
      stride: 1
    - type: BatchNorm2d
      num_features: 32
    - type: ReLU
    - type: MaxPool2d
      kernel_size: 2
      stride: 2
    - type: Flatten
    - type: Linear
      in_features: 2048 
      out_features: 512
    - type: BatchNorm1d
      num_features: 512
    - type: ReLU
    - type: Dropout
      p: 0.2
    - type: Linear
      in_features: 512
      out_features: 256
    - type: BatchNorm1d
      num_features: 256
    - type: ReLU
    - type: Dropout
      p: 0.2
    - type: Linear
      in_features: 256
      out_features: latent_dim
  decoder_image:
    - type: Linear
      in_features: latent_dim
      out_features: 256
    - type: BatchNorm1d
      num_features: 256
    - type: ReLU
    - type: Dropout
      p: 0.2
    - type: Linear
      in_features: 256
      out_features: 2048
    - type: BatchNorm1d
      num_features: 2048
    - type: ReLU
    - type: Dropout
      p: 0.2
    - type: Unflatten
      shape: [32, 8, 8]  # Adjust this according to the output size after the final convolutional encoder layer

    - type: Conv2d
      in_channels: 32
      out_channels: 32
      kernel_size: 2
      stride: 1
      padding: same
    - type: BatchNorm2d
      num_features: 32
    - type: ReLU

    - type: Upsample
      scale_factor: 2
      mode: nearest
    - type: Conv2d
      in_channels: 32
      out_channels: 32
      kernel_size: 4
      stride: 1
      padding: same
    - type: BatchNorm2d
      num_features: 32
    - type: ReLU

    - type: Upsample
      scale_factor: 2
      mode: nearest
    - type: Conv2d
      in_channels: 32
      out_channels: 64
      kernel_size: 4
      stride: 1
      padding: same
    - type: BatchNorm2d
      num_features: 64
    - type: ReLU

    - type: Upsample
      scale_factor: 2
      mode: nearest
    - type: Conv2d
      in_channels: 64
      out_channels: 32
      kernel_size: 2
      stride: 1
      padding: same
    - type: BatchNorm2d
      num_features: 32
    - type: ReLU

    - type: Upsample
      scale_factor: 2
      mode: nearest
    - type: Conv2d
      in_channels: 32
      out_channels: num_channels
      kernel_size: 2
      stride: 1
      padding: same

    - type: Sigmoid
  decoder_timepoint:
    - type: Linear
      in_features: latent_dim
      out_features: 128
    - type: BatchNorm1d
      num_features: 128
    - type: ReLU
    - type: Linear
      in_features: 128
      out_features: 128
    - type: BatchNorm1d
      num_features: 128
    - type: ReLU
    - type: Linear
      in_features: 128
      out_features: 64
    - type: BatchNorm1d
      num_features: 64
    - type: ReLU
    - type: Linear
      in_features: 64
      out_features: 32
    - type: BatchNorm1d
      num_features: 32
    - type: ReLU
    - type: Linear
      in_features: 32
      out_features: 15
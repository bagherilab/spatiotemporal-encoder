type: AE
architecture:
  encoder:
    - type: Conv2d
      in_channels: num_channels
      out_channels: 16
      kernel_size: 3
      padding: 1
      stride: 1
    - type: BatchNorm2d
      num_features: 16
    - type: ReLU
    - type: MaxPool2d
      kernel_size: 2
      stride: 2

    - type: Conv2d
      in_channels: 16
      out_channels: 32
      kernel_size: 3
      padding: 1
      stride: 1
    - type: BatchNorm2d
      num_features: 32
    - type: ReLU
    - type: MaxPool2d
      kernel_size: 2
      stride: 2

    - type: Conv2d
      in_channels: 32
      out_channels: 64
      kernel_size: 3
      padding: 1
      stride: 1
    - type: BatchNorm2d
      num_features: 64
    - type: ReLU
    - type: MaxPool2d
      kernel_size: 2
      stride: 2

    - type: Flatten
    - type: Linear
      in_features: 16384 
      out_features: 512
    - type: BatchNorm1d
      num_features: 512
    - type: ReLU
    
    - type: Linear
      in_features: 512
      out_features: latent_dim
    
  decoder_image:
    - type: Linear
      in_features: latent_dim
      out_features: 512
    - type: BatchNorm1d
      num_features: 512
    - type: ReLU

    - type: Linear
      in_features: 512
      out_features: 16384
    - type: ReLU

    - type: Unflatten
      shape: [64, 16, 16]

    - type: ConvTranspose2d
      in_channels: 64
      out_channels: 32
      kernel_size: 2
      stride: 2
    - type: BatchNorm2d
      num_features: 32
    - type: ReLU

    - type: ConvTranspose2d
      in_channels: 32
      out_channels: 16
      kernel_size: 2
      stride: 2
    - type: BatchNorm2d
      num_features: 16
    - type: ReLU

    - type: ConvTranspose2d
      in_channels: 16
      out_channels: num_channels
      kernel_size: 2
      stride: 2
    - type: Sigmoid

  decoder_timepoint:
    - type: Linear
      in_features: latent_dim
      out_features: 64
    - type: BatchNorm1d
      num_features: 64
    - type: ReLU
    
    - type: Linear
      in_features: 64
      out_features: 32
    - type: BatchNorm1d
      num_features: 32
    - type: ReLU
    
    - type: Linear
      in_features: 32
      out_features: 15
type: AE
architecture:
  encoder:
    - type: Flatten

    - type: Linear
      in_features: num_channels
      out_features: 32
    - type: BatchNorm1d
      num_features: 32
    - type: ReLU
    
    - type: Linear
      in_features: 32
      out_features: 64
    - type: BatchNorm1d
      num_features: 64
    - type: ReLU
    
    - type: Linear
      in_features: 64
      out_features: 128
    - type: BatchNorm1d
      num_features: 128
    - type: ReLU

    - type: Linear
      in_features: 128
      out_features: 256
    - type: BatchNorm1d
      num_features: 256
    - type: ReLU

    - type: Linear
      in_features: 256
      out_features: 256
    - type: BatchNorm1d
      num_features: 256
    - type: ReLU
    
    - type: Linear
      in_features: 256
      out_features: latent_dim

  decoder_image:
    - type: Linear
      in_features: latent_dim
      out_features: 512
    - type: BatchNorm1d
      num_features: 512
    - type: ReLU
    - type: Linear
      in_features: 512
      out_features: decoder_spatial_flat
    - type: BatchNorm1d
      num_features: decoder_spatial_flat
    - type: ReLU
    - type: Unflatten
      shape: [decoder_init_channels, decoder_base_hw, decoder_base_hw]
      
    - type: PointwiseLinear
      in_channels: decoder_init_channels
      out_channels: 48
    - type: BatchNorm2d
      num_features: 48
    - type: ReLU
    - type: Upsample
      scale_factor: 2
      mode: bilinear
      align_corners: false

    - type: PointwiseLinear
      in_channels: 48
      out_channels: 32
    - type: BatchNorm2d
      num_features: 32
    - type: ReLU
    - type: Upsample
      scale_factor: 2
      mode: bilinear
      align_corners: false

    - type: PointwiseLinear
      in_channels: 32
      out_channels: 24
    - type: BatchNorm2d
      num_features: 24
    - type: ReLU
    - type: Upsample
      scale_factor: 2
      mode: bilinear
      align_corners: false
    - type: PointwiseLinear
      in_channels: 24
      out_channels: 16
    - type: BatchNorm2d
      num_features: 16
    - type: ReLU
    - type: Upsample
      scale_factor: 2
      mode: bilinear
      align_corners: false
    - type: PointwiseLinear
      in_channels: 16
      out_channels: num_channels
    - type: Sigmoid

  decoder_timepoint:
    - type: Linear
      in_features: latent_dim
      out_features: 64
    - type: BatchNorm1d
      num_features: 64
    - type: ReLU
    
    - type: Linear
      in_features: 64
      out_features: 32
    - type: BatchNorm1d
      num_features: 32
    - type: ReLU
    
    - type: Linear
      in_features: 32
      out_features: num_timepoints
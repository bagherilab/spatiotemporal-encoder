type: CAE
architecture:
  encoder:
    - type: Flatten
    - type: Linear
      in_features: num_channels
      out_features: 1024
    - type: BatchNorm1d
      num_features: 1024
    - type: ReLU
    - type: Linear
      in_features: 1024
      out_features: 400
    - type: BatchNorm1d
      num_features: 400
    - type: ReLU
    - type: Linear
      in_features: 400
      out_features: 225
    - type: BatchNorm1d
      num_features: 225
    - type: ReLU
    - type: Linear
      in_features: 225
      out_features: 100
    - type: BatchNorm1d
      num_features: 100
    - type: ReLU
    - type: Linear
      in_features: 100
      out_features: latent_dim
  decoder_image:
    - type: Linear
      in_features: latent_dim
      out_features: 100
    - type: BatchNorm1d
      num_features: 100
    - type: ReLU
    - type: Linear
      in_features: 100
      out_features: 225
    - type: BatchNorm1d
      num_features: 225
    - type: ReLU
    - type: Linear
      in_features: 225
      out_features: 400
    - type: BatchNorm1d
      num_features: 400
    - type: ReLU
    - type: Linear
      in_features: 400
      out_features: 1024
    - type: BatchNorm1d
      num_features: 1024
    - type: ReLU
    - type: Linear
      in_features: 1024
      out_features: num_channels
    - type: Unflatten
  decoder_timepoint:
    - type: Linear
      in_features: latent_dim
      out_features: 64
    - type: BatchNorm1d
      num_features: 64
    - type: ReLU
    - type: Linear
      in_features: 64
      out_features: 128
    - type: BatchNorm1d
      num_features: 128
    - type: ReLU
    - type: Linear
      in_features: 128
      out_features: 64
    - type: BatchNorm1d
      num_features: 64
    - type: ReLU
    - type: Linear
      in_features: 64
      out_features: 15
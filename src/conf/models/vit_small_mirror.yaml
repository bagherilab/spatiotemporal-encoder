type: AE
architecture:
  encoder:
    - type: VisionTransformer
      patch_size: 16
      embed_dim: 192
      depth: 6
      num_heads: 3
      mlp_ratio: 3.1
      dropout: 0.0
      pool: mean
      in_channels: num_channels
      image_size: image_size
      out_dim: 512
    - type: BatchNorm1d
      num_features: vit_encoder_proj_dim
    - type: ReLU
    - type: Linear
      in_features: vit_encoder_proj_dim
      out_features: latent_dim

  decoder_image:
    - type: Linear
      in_features: latent_dim
      out_features: vit_encoder_proj_dim
    - type: BatchNorm1d
      num_features: vit_encoder_proj_dim
    - type: ReLU
    - type: VisionTransformerDecoder
      latent_dim: vit_encoder_proj_dim
      patch_size: 16
      embed_dim: 192
      depth: 6
      num_heads: 3
      mlp_ratio: 3.1
      dropout: 0.0
      in_channels: num_channels
      image_size: image_size
      token_init: broadcast
    - type: Sigmoid

  decoder_timepoint:
    - type: Linear
      in_features: latent_dim
      out_features: 64
    - type: BatchNorm1d
      num_features: 64
    - type: ReLU
    - type: Linear
      in_features: 64
      out_features: 32
    - type: BatchNorm1d
      num_features: 32
    - type: ReLU
    - type: Linear
      in_features: 32
      out_features: num_timepoints

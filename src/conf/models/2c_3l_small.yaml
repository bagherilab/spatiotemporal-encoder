architecture:
  encoder:
    - type: Conv2d
      in_channels: 2 #tumor pic and vasculature pic
      out_channels: 16
      kernel_size: 3
      padding: 1
      stride: 2
    - type: BatchNorm2d
      num_features: 16
    - type: ReLU
    - type: MaxPool2d
      kernel_size: 2
      stride: 2
    - type: Conv2d
      in_channels: 16 # can think of these as # of images
      out_channels: 8
      kernel_size: 3
      padding: 1
      stride: 2
    - type: BatchNorm2d
      num_features: 8
    - type: ReLU
    - type: MaxPool2d
      kernel_size: 2
      stride: 2
    - type: Flatten
    - type: Linear #take all of the channels and flatten into a vector
      in_features: 2048 #has to match # of pixels from conv layer: square image --> vector
      out_features: 256
    - type: BatchNorm1d
      num_features: 256
    - type: ReLU
    - type: Linear
      in_features: 256
      out_features: 64
    - type: BatchNorm1d
      num_features: 64
    - type: ReLU
    - type: Linear
      in_features: 64
      out_features: 32 #last layer of the encoder, size of the Z
  decoder_image: #same as the encoder in reverse (have to unpack Z/rebuild image)
    - type: Linear
      in_features: 32
      out_features: 64
    - type: BatchNorm1d
      num_features: 64
    - type: ReLU
    - type: Linear
      in_features: 64
      out_features: 256
    - type: BatchNorm1d
      num_features: 256
    - type: ReLU
    - type: Linear
      in_features: 256
      out_features: 2048
    - type: BatchNorm1d
      num_features: 2048
    - type: ReLU
    - type: Unflatten
      shape: [8, 16, 16]
    - type: UpsamplingBilinear2d
      scale_factor: 2
    - type: ConvTranspose2d
      in_channels: 8
      out_channels: 16
      kernel_size: 3
      padding: 1
      output_padding: 1
      stride: 2
    - type: BatchNorm2d
      num_features: 16
    - type: ReLU
    - type: UpsamplingBilinear2d
      scale_factor: 2
    - type: ConvTranspose2d
      in_channels: 16
      out_channels: 2
      kernel_size: 3
      padding: 1
      output_padding: 1
      stride: 2
  decoder_timepoint:
    - type: Linear
      in_features: 32
      out_features: 64
    - type: BatchNorm1d
      num_features: 64
    - type: ReLU
    - type: Linear
      in_features: 64
      out_features: 128
    - type: BatchNorm1d
      num_features: 128
    - type: ReLU
    - type: Linear
      in_features: 128
      out_features: 64
    - type: BatchNorm1d
      num_features: 64
    - type: ReLU
    - type: Linear
      in_features: 64
      out_features: 15
      
      
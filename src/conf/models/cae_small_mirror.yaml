type: AE
architecture:
  encoder:
    - type: Conv2d
      in_channels: num_channels
      out_channels: 64
      kernel_size: 3
      padding: 1
      stride: 1
    - type: BatchNorm2d
      num_features: 64
    - type: ReLU
    - type: MaxPool2d
      kernel_size: 2
      stride: 2

    - type: Conv2d
      in_channels: 64
      out_channels: 128
      kernel_size: 3
      padding: 1
      stride: 1
    - type: BatchNorm2d
      num_features: 128
    - type: ReLU
    - type: MaxPool2d
      kernel_size: 2
      stride: 2

    - type: Conv2d
      in_channels: 128
      out_channels: 256
      kernel_size: 3
      padding: 1
      stride: 1
    - type: BatchNorm2d
      num_features: 256
    - type: ReLU
    - type: MaxPool2d
      kernel_size: 2
      stride: 2

    - type: Conv2d
      in_channels: 256
      out_channels: 256
      kernel_size: 3
      padding: 1
      stride: 1
    - type: BatchNorm2d
      num_features: 256
    - type: ReLU
    - type: MaxPool2d
      kernel_size: 2
      stride: 2

    - type: Conv2d
      in_channels: 256
      out_channels: 512
      kernel_size: 3
      padding: 1
      stride: 1
    - type: BatchNorm2d
      num_features: 512
    - type: ReLU

    - type: AdaptiveAvgPool2d
      output_size: 1
    - type: Flatten
    - type: Linear
      in_features: 512
      out_features: 512
    - type: BatchNorm1d
      num_features: 512
    - type: ReLU

    - type: Linear
      in_features: 512
      out_features: latent_dim

  decoder_image:
    - type: Linear
      in_features: latent_dim
      out_features: 512
    - type: BatchNorm1d
      num_features: 512
    - type: ReLU

    - type: Linear
      in_features: 512
      out_features: 512
    - type: BatchNorm1d
      num_features: 512
    - type: ReLU

    - type: Unflatten
      shape: [512, 1, 1]

    - type: Upsample
      scale_factor: 8
      mode: bilinear
      align_corners: false

    - type: ConvTranspose2d
      in_channels: 512
      out_channels: 256
      kernel_size: 3
      padding: 1
      stride: 1
    - type: BatchNorm2d
      num_features: 256
    - type: ReLU

    - type: Upsample
      scale_factor: 2
      mode: bilinear
      align_corners: false
    - type: ConvTranspose2d
      in_channels: 256
      out_channels: 256
      kernel_size: 3
      padding: 1
      stride: 1
    - type: BatchNorm2d
      num_features: 256
    - type: ReLU

    - type: Upsample
      scale_factor: 2
      mode: bilinear
      align_corners: false
    - type: ConvTranspose2d
      in_channels: 256
      out_channels: 128
      kernel_size: 3
      padding: 1
      stride: 1
    - type: BatchNorm2d
      num_features: 128
    - type: ReLU

    - type: Upsample
      scale_factor: 2
      mode: bilinear
      align_corners: false
    - type: ConvTranspose2d
      in_channels: 128
      out_channels: 64
      kernel_size: 3
      padding: 1
      stride: 1
    - type: BatchNorm2d
      num_features: 64
    - type: ReLU

    - type: Upsample
      scale_factor: 2
      mode: bilinear
      align_corners: false
    - type: ConvTranspose2d
      in_channels: 64
      out_channels: num_channels
      kernel_size: 3
      padding: 1
      stride: 1
    - type: Sigmoid

  decoder_timepoint:
    - type: Linear
      in_features: latent_dim
      out_features: 64
    - type: BatchNorm1d
      num_features: 64
    - type: ReLU

    - type: Linear
      in_features: 64
      out_features: 32
    - type: BatchNorm1d
      num_features: 32
    - type: ReLU

    - type: Linear
      in_features: 32
      out_features: num_timepoints

architecture:
  encoder_layers:
    - type: Conv2d
      in_channels: 2
      out_channels: 32
      kernel_size: 3
      padding: 1
      stride: 2
      activation: ReLU
    - type: MaxPool2d
      kernel_size: 2
      stride: 2
    - type: Flatten
    - type: Linear
      in_features: 131072
      out_features: 64
      activation: ReLU
    - type: Linear
      in_features: 64
      out_features: 100
  decoder_layers:
    - type: Linear
      in_features: 100
      out_features: 64
      activation: ReLU
    - type: Linear
      in_features: 64

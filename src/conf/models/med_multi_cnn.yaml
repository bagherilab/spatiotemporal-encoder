architecture:
  encoder:
    - type: Conv2d
      in_channels: 3
      out_channels: 32
      kernel_size: 3
      padding: 1
      stride: 2
      activation: ReLU
    - type: MaxPool2d
      kernel_size: 2
      stride: 2
    - type: Conv2d
      in_channels: 32
      out_channels: 16
      kernel_size: 3
      padding: 1
      stride: 2
      activation: ReLU
    - type: MaxPool2d
      kernel_size: 2
      stride: 2
    - type: Flatten
    - type: Linear
      in_features: 4096
      out_features: 256
      activation: ReLU
    - type: Linear
      in_features: 256
      out_features: 64
      activation: ReLU
    - type: Linear
      in_features: 64
      out_features: 16
  decoder_image:
    - type: Linear
      in_features: 16
      out_features: 64
      activation: ReLU
    - type: Linear
      in_features: 64
      out_features: 256
      activation: ReLU
    - type: Linear
      in_features: 256
      out_features: 4096
      activation: ReLU
    - type: Unflatten
      shape: [16, 16, 16]
    - type: UpsamplingBilinear2d
      scale_factor: 2
    - type: ConvTranspose2d
      in_channels: 16
      out_channels: 32
      kernel_size: 3
      padding: 1
      output_padding: 1
      stride: 2
    - type: UpsamplingBilinear2d
      scale_factor: 2
    - type: ConvTranspose2d
      in_channels: 32
      out_channels: 3
      kernel_size: 3
      padding: 1
      output_padding: 1
      stride: 2
  decoder_timepoint:
    - type: Linear
      in_features: 16
      out_features: 64
      activation: ReLU
    - type: Linear
      in_features: 64
      out_features: 128
      activation: ReLU
    - type: Linear
      in_features: 128
      out_features: 64
      activation: ReLU
    - type: Linear
      in_features: 64
      out_features: 15
    
    
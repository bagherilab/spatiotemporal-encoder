type: AE
architecture:
  encoder:
    - type: Flatten
    - type: Linear
      in_features: num_channels
      out_features: 4096
    - type: BatchNorm1d
      num_features: 4096
    - type: ReLU

    - type: Linear
      in_features: 4096
      out_features: 2048
    - type: BatchNorm1d
      num_features: 2048
    - type: ReLU

    - type: Linear
      in_features: 2048
      out_features: 1024
    - type: BatchNorm1d
      num_features: 1024
    - type: ReLU
    
    - type: Linear
      in_features: 1024
      out_features: 512
    - type: BatchNorm1d
      num_features: 512
    - type: ReLU
    
    - type: Linear
      in_features: 512
      out_features: 256
    - type: BatchNorm1d
      num_features: 256
    - type: ReLU
    
    - type: Linear
      in_features: 256
      out_features: 128
    - type: BatchNorm1d
      num_features: 128
    - type: ReLU
    
    - type: Linear
      in_features: 128
      out_features: latent_dim

  decoder_image:
    - type: Linear
      in_features: latent_dim
      out_features: 128
    - type: BatchNorm1d
      num_features: 128
    - type: ReLU
    
    - type: Linear
      in_features: 128
      out_features: 256
    - type: BatchNorm1d
      num_features: 256
    - type: ReLU
    
    - type: Linear
      in_features: 256
      out_features: 512
    - type: BatchNorm1d
      num_features: 512
    - type: ReLU
    
    - type: Linear
      in_features: 512
      out_features: 1024
    - type: BatchNorm1d
      num_features: 1024
    - type: ReLU
    
    - type: Linear
      in_features: 1024
      out_features: 2048
    - type: BatchNorm1d
      num_features: 2048
    - type: ReLU

    - type: Linear
      in_features: 2048
      out_features: 4096
    - type: BatchNorm1d
      num_features: 4096
    - type: ReLU

    - type: Linear
      in_features: 4096
      out_features: num_channels

    - type: Unflatten
    - type: Sigmoid

  decoder_timepoint:
    - type: Linear
      in_features: latent_dim
      out_features: 64
    - type: BatchNorm1d
      num_features: 64
    - type: ReLU
    
    - type: Linear
      in_features: 64
      out_features: 32
    - type: BatchNorm1d
      num_features: 32
    - type: ReLU
    
    - type: Linear
      in_features: 32
      out_features: num_timepoints
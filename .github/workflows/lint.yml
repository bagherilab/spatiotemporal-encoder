# lint.yml
name: lint

on: [push]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the repo
      uses: actions/checkout@v2

    - name: Set up Python 3.12
      uses: actions/setup-python@v2
      with:
        python-version: 3.12

    - name: Set up virtual environment
      run: python -m venv .venv

    - name: Activate virtual environment
      run: source .venv/bin/activate

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Install test dependencies
      run: pip install -r tests/requirements.txt

    - name: Lint with black
      run: black -l 100 --check src/ tests/

    - name: Lint with pylint
      run: pylint --ignore-patterns=test.*?py --fail-under=7.0 --disable import-error src/ tests/

    - name: Lint with mypy
      run: mypy --config-file mypy.ini --disallow-untyped-calls --disallow-untyped-defs --disallow-incomplete-defs src

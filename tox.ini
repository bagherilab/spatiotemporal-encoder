[tox]
isolated_build = True
skipsdist=True

[testenv]
allowlist_externals = uv
sitepackages = True
commands =
    uv run pytest --cov-report html --cov=src/ tests/

[testenv:linter]
allowlist_externals = uv
sitepackages = True
commands =
    uv run check src/ tests/
    uv run format --fail-under=8.0 src/ tests/

[testenv:mypy]
allowlist_externals = uv
sitepackages = True
commands = 
    uv run mypy --config-file mypy.ini --disallow-untyped-calls --disallow-untyped-defs --disallow-incomplete-defs src